name: Scrape and notify (main threads)

# メインスレ(directThreads)専用の軽量バッチ(系統②の分割)。
# 地域別巡回(scrape.yml)と分離して高頻度で起動することで、メインスレへの
# 新着レスの検知を速くすることを目的とする(地域別スレは scrape.yml が担当)。
#
# - SCRAPER_DIRECT_ONLY=1 を渡すため、キーワード検索・一覧巡回は行わず
#   設定 gist の directThreads だけを取得する(directThreads 未設定なら何もせず正常終了)
# - 通知は scrape.yml と同じく「秘密 gist に全文投稿 → Discord に URL だけ通知」
# - 新着判定の状態は scrape.yml とは**別キャッシュキー**(scrape-main-state-v1-)
#   で引き継ぐ。両 workflow が同じスレを二重に通知しないよう、地域別側
#   (scrape.yml)は SCRAPER_SKIP_DIRECT=1 で直接指定スレをスキップしている
# - 実行統計は Actions ログでのみ確認する(件数のみ。log/latest-run.md には
#   書かない。複数 workflow が同じファイルを更新すると競合するため)
# - 起動は 30 分おき(schedule)。GitHub Actions の schedule は間引きされる
#   ことがあるため、指定時刻から遅れる・起動がスキップされる場合がある。
#   確実に起動したい場合は Worker cron(workflow_dispatch、GH_DISPATCH_TOKEN
#   シークレットが必要)が 10 分おきに dispatch するのでそちらが主経路

on:
  schedule:
    # 30 分おき。cron は UTC 指定。分を 17/47 にずらすのは
    # :00 / :30 の起動集中・間引きを避けるため(前後数分の起動遅れはあり得る)
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: scrape-and-notify-main
  cancel-in-progress: false

jobs:
  scrape-and-notify-main:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Restore scraper config
        env:
          SCRAPER_CONFIG: ${{ secrets.SCRAPER_CONFIG }}
        run: |
          if [ -n "$SCRAPER_CONFIG" ]; then
            printf '%s' "$SCRAPER_CONFIG" > scraper/config.json
            echo "scraper/config.json をシークレットから復元しました"
          else
            echo "SCRAPER_CONFIG が未設定のため、モックモードで実行します"
          fi

      - name: Restore new-thread detection state
        uses: actions/cache/restore@v5
        with:
          path: .scrape-state.json
          key: scrape-main-state-v1-${{ github.run_id }}
          restore-keys: scrape-main-state-v1-

      - name: Scrape main threads
        env:
          SCRAPER_DOMAIN: ${{ secrets.SCRAPER_DOMAIN }}
          # 巡回設定 gist(directThreads は gist の JSON から読む)
          SCRAPER_SETTINGS_GIST_URL: ${{ secrets.SCRAPER_SETTINGS_GIST_URL }}
          # 設定 gist が秘密 gist の場合に必要(gist 権限の PAT)
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # 直接指定スレ(directThreads)のみを巡回するモード
          SCRAPER_DIRECT_ONLY: "1"
        run: npm run scrape

      - name: Resolve mirror URL
        # ミラー(系統①)の URL を自動解決して GITHUB_ENV の MIRROR_URL に渡す。
        # 1) シークレット MIRROR_URL があればそれをそのまま使う(手動設定が優先)
        # 2) なければ Cloudflare API で workers.dev のサブドメインを取得し、
        #    wrangler.jsonc の Worker 名から URL を組み立てる
        # URL の値はログに出さない(失敗時は警告のみで続行)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
        run: |
          if [ -z "$MIRROR_URL" ]; then
            NAME=$(node -e 'const s=require("fs").readFileSync("wrangler.jsonc","utf8");const m=s.match(/"name"\s*:\s*"([^"]+)"/);console.log(m?m[1]:"")')
            SUB=$(curl -s --fail-with-body -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).result?.subdomain??"")}catch{console.log("")}})') || SUB=""
            if [ -n "$NAME" ] && [ -n "$SUB" ]; then
              echo "MIRROR_URL=https://$NAME.$SUB.workers.dev" >> "$GITHUB_ENV"
              echo "ミラー URL を自動解決しました(workers.dev)"
            else
              echo "::warning::ミラー URL を自動解決できませんでした(シークレット MIRROR_URL でも設定できます)"
            fi
          else
            echo "シークレット MIRROR_URL を使用します"
            echo "MIRROR_URL=$MIRROR_URL" >> "$GITHUB_ENV"
          fi

      - name: Notify (Gist + Discord)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # 設定 gist の読み込み(mirrorUrl があれば元スレにミラーリンクを併記)
          SCRAPER_SETTINGS_GIST_URL: ${{ secrets.SCRAPER_SETTINGS_GIST_URL }}
          # ミラーサイト(系統①)の URL。前のステップで自動解決 or シークレットを
          # GITHUB_ENV に設定済み(未設定なら gist の mirrorUrl、それもなければ
          # ミラーリンクなし)。URL の値はログには出さない
          # この実行がメインスレ専用であることを notify に伝える
          # (Discord の見出しが「メインスレの更新がありました。」になる)
          SCRAPER_DIRECT_ONLY: "1"
        run: npm run notify

      - name: Save new-thread detection state
        # DISCORD_WEBHOOK_URL / GIST_TOKEN 未登録時は notify が状態を更新しないため
        # ファイルが存在しない。actions/cache/save は存在しないパスで失敗するため、
        # 存在するときだけ保存する
        if: ${{ hashFiles('.scrape-state.json') != '' }}
        uses: actions/cache/save@v5
        with:
          path: .scrape-state.json
          key: scrape-main-state-v1-${{ github.run_id }}