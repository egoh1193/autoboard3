name: Deploy site

# 系統①(サイト本体)のデプロイ。
# サイトはアクセス時に Worker がリアルタイムでスクレイピングするため、
# 事前のデータ生成は不要。Worker/フロントのコード変更時にデプロイする。
#
# Worker の実運用設定(セレクタ等)はシークレット SCRAPER_CONFIG を
# Worker secret SCRAPER_CONFIG として同期する(設定が変わるたびに自動反映)。

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml" # ワークフロー変更だけでも Worker secret の同期を反映する
      - "site/**"
      - "worker/**"
      - "wrangler.jsonc"
      - "scraper/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        # wrangler は package.json の devDependency(ロックファイルで 4.x に固定)。
        # npm ci 済みなのでアクションはローカルの wrangler を使う。
        # (v3 が 3.90.0 を入れた結果 wrangler.jsonc 未対応の 3.x で失敗したため v4 へ)
        # Cloudflare 未設定(CLOUDFLARE_API_TOKEN 未登録)の間はデプロイをスキップする。
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy skipped (Cloudflare not configured)
        # 前ステップをスキップした場合の案内。シークレット登録後は自動でデプロイされる
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "CLOUDFLARE_API_TOKEN 未登録のためデプロイをスキップしました(Cloudflare 登録後は自動デプロイ)"

      - name: Sync scraper settings to Worker secrets
        # Cloudflare 未設定の間は wrangler が認証できず失敗するため、デプロイと同じくスキップ
        # SCRAPER_CONFIG(JSON 全体)があればそれを、無ければ SCRAPER_DOMAIN /
        # SCRAPER_SEX_EXCLUDES(バッチと同じリポジトリシークレット)を Worker secret に
        # 同期する。Worker は SCRAPER_DOMAIN があればパス・クエリを config の
        # targetUrl から補完して実モードになる(worker/src/scrape.ts loadConfig)。
        # SCRAPER_CONFIG も SCRAPER_DOMAIN も無いときだけ Worker はモックモードになる
        # GH_DISPATCH_TOKEN(Actions: Write 権限の PAT)は Worker cron が
        # scrape.yml を workflow_dispatch で起動するために使う。値はログに出さない
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          SCRAPER_CONFIG: ${{ secrets.SCRAPER_CONFIG }}
          SCRAPER_DOMAIN: ${{ secrets.SCRAPER_DOMAIN }}
          SCRAPER_SEX_EXCLUDES: ${{ secrets.SCRAPER_SEX_EXCLUDES }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          sync_secret() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
              echo "Worker secret $1 を更新しました"
            else
              echo "リポジトリシークレット $1 が未設定のため、Worker secret への同期をスキップします"
            fi
          }
          sync_secret SCRAPER_CONFIG "$SCRAPER_CONFIG"
          sync_secret SCRAPER_DOMAIN "$SCRAPER_DOMAIN"
          sync_secret SCRAPER_SEX_EXCLUDES "$SCRAPER_SEX_EXCLUDES"
          sync_secret GH_DISPATCH_TOKEN "$GH_DISPATCH_TOKEN"
          if [ -z "$SCRAPER_CONFIG" ] && [ -z "$SCRAPER_DOMAIN" ]; then
            echo "::warning::SCRAPER_CONFIG / SCRAPER_DOMAIN どちらも未設定のため、Worker はモックモードで動作します"
          fi

      - name: Sync main threads (directThreads) to Worker secret
        # 設定 gist の JSON から directThreads(メインスレ)だけを抽出して
        # Worker secret SCRAPER_DIRECT_THREADS に同期する。Worker は一覧とは別の
        # 「メインスレ」リンクとして取得・表示する(系統③ の投稿先スレなど)。
        # gist URL・ID・内容・スレタイはログに出さない(件数のみ)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          SCRAPER_SETTINGS_GIST_URL: ${{ secrets.SCRAPER_SETTINGS_GIST_URL }}
          GIST_API_URL: ${{ vars.GIST_API_URL || '' }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$SCRAPER_SETTINGS_GIST_URL" ]; then
            echo "設定 gist(SCRAPER_SETTINGS_GIST_URL)未設定のためメインスレの同期をスキップします"
            exit 0
          fi
          node -e '
            (async () => {
              const raw = process.env.SCRAPER_SETTINGS_GIST_URL ?? "";
              const trimmed = raw.trim();
              let id = trimmed;
              if (trimmed.includes("://")) {
                try {
                  const u = new URL(trimmed);
                  const parts = u.pathname.split("/").filter(Boolean);
                  id = u.hostname === "gist.githubusercontent.com" ? (parts[1] ?? "") : (parts[parts.length - 1] ?? "");
                } catch { id = ""; }
              }
              if (!id) { require("fs").writeFileSync("/tmp/direct-threads.json", "[]"); console.log("設定 gist の URL を解釈できず空配列で同期します"); process.exit(0); }
              const headers = { Accept: "application/vnd.github+json", "User-Agent": "board-mirror-deploy" };
              if (process.env.GIST_TOKEN) headers.Authorization = `Bearer ${process.env.GIST_TOKEN}`;
              const base = (process.env.GIST_API_URL || "https://api.github.com/gists").replace(/\/$/, "");
              const res = await fetch(`${base}/${id}`, { headers });
              if (!res.ok) { console.error(`設定 gist の取得に失敗しました (HTTP ${res.status})`); process.exit(1); }
              const data = await res.json();
              const jsonFile = Object.values(data.files ?? {}).find((f) => typeof f?.content === "string" && f?.filename?.endsWith(".json"));
              if (!jsonFile) { require("fs").writeFileSync("/tmp/direct-threads.json", "[]"); console.log("設定 gist に JSON がないためメインスレなしで同期します"); process.exit(0); }
              const parsed = JSON.parse(jsonFile.content);
              const dt = Array.isArray(parsed.directThreads) ? parsed.directThreads : [];
              require("fs").writeFileSync("/tmp/direct-threads.json", JSON.stringify(dt));
              console.log(`directThreads を抽出しました(件数 ${dt.length})`);
            })();
          '
          printf '%s' "$(cat /tmp/direct-threads.json)" | npx wrangler secret put SCRAPER_DIRECT_THREADS
          echo "Worker secret SCRAPER_DIRECT_THREADS を更新しました"
          rm -f /tmp/direct-threads.json