name: Scrape and notify

# 定期バッチ(系統②): 掲示板をスクレイピングし、新着スレッドの詳細を
# GitHub Gist に投稿して、その URL を Discord に通知する。
# サイト(系統①)はアクセス時に Worker がリアルタイム取得するため、
# このワークフローではデプロイを行わない。
#
# scraper/config.json はリポジトリにコミットされないため、
# リポジトリシークレット SCRAPER_CONFIG(JSON 文字列)から復元する。
# (未設定の場合はモックモードで実行される)
# 新着検出の状態(.scrape-state.json)は actions/cache で次回実行へ引き継ぐ。
# GIST_TOKEN には gist 権限を持つ PAT を指定すること
# (Actions 既定の GITHUB_TOKEN では gist を作成できない)。
#
# 各実行の統計は RUN_SUMMARY_JSON(/tmp 配下)に書き出され、最後に
# scraper/run-log.mjs 経由で log/latest-run.md に反映・コミットされる
# (public リポジトリに「最終実行ログ 1 ファイル」を残すため。統計のみで
#  ドメイン・URL・スレタイ・投稿内容・gist URL は含めない)。

on:
  schedule:
    # 5 分おき(GitHub Actions の cron で設定できる最短間隔は約 5 分。
    # 正時の :00/:05… は全ユーザーが集中するため 2 分ずらして開始)
    - cron: "2-59/5 * * * *"
  push:
    branches: [main] # 手元検証用(main への push でも実行。bot の run log push は GITHUB_TOKEN のため再トリガーされない)
  workflow_dispatch:

concurrency:
  group: scrape-and-notify
  cancel-in-progress: false

permissions:
  contents: write # log/latest-run.md のコミット・push 用

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Restore scraper config
        env:
          SCRAPER_CONFIG: ${{ secrets.SCRAPER_CONFIG }}
        run: |
          if [ -n "$SCRAPER_CONFIG" ]; then
            printf '%s' "$SCRAPER_CONFIG" > scraper/config.json
            echo "scraper/config.json をシークレットから復元しました"
          else
            echo "SCRAPER_CONFIG が未設定のため、モックモードで実行します"
          fi

      - name: Restore new-thread detection state
        uses: actions/cache/restore@v4
        with:
          path: .scrape-state.json
          key: scrape-state-v1-${{ github.run_id }}
          restore-keys: scrape-state-v1-

      - name: Scrape
        env:
          # 実サイトのドメインをシークレット SCRAPER_DOMAIN から与える
          # (未登録なら config.json 依存、どちらもなければモックモード)
          SCRAPER_DOMAIN: ${{ secrets.SCRAPER_DOMAIN }}
          # 巡回キーワード(カンマ区切り)。指定すると各キーワードでスレ検索する
          SCRAPER_KEYWORDS: ${{ secrets.SCRAPER_KEYWORDS }}
          # 性別排除キーワード(カンマ区切り、部分一致)。該当するレスを出力から除外する
          SCRAPER_SEX_EXCLUDES: ${{ secrets.SCRAPER_SEX_EXCLUDES }}
          # ブラックリスト(カンマ区切り、メールアドレス完全一致)。
          # 該当するメールアドレスのレスを出力から除外する
          SCRAPER_BLACKLIST: ${{ secrets.SCRAPER_BLACKLIST }}
          # 巡回設定 gist の URL(シークレット)。SCRAPER_KEYWORDS / SCRAPER_SEX_EXCLUDES
          # 未設定時に gist 内の JSON から読み込む。URL・ID はログには出ない
          SCRAPER_SETTINGS_GIST_URL: ${{ secrets.SCRAPER_SETTINGS_GIST_URL }}
          # 設定 gist が秘密 gist の場合に必要(gist 権限の PAT)
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # 実行サマリの書き出し先(log/latest-run.md 更新の入力)
          RUN_SUMMARY_JSON: /tmp/run-summary.json
        run: npm run scrape

      - name: Notify (Gist + Discord)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          RUN_SUMMARY_JSON: /tmp/run-summary.json
        run: npm run notify

      - name: Save new-thread detection state
        # DISCORD_WEBHOOK_URL / GIST_TOKEN 未登録時は notify が状態を更新しないため
        # ファイルが存在しない。actions/cache/save は存在しないパスで失敗するため、
        # 存在するときだけ保存する
        if: ${{ hashFiles('.scrape-state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .scrape-state.json
          key: scrape-state-v1-${{ github.run_id }}

      - name: Update latest run log (log/latest-run.md)
        # スクレイプ失敗時もサマリは書き出されているので、always() で常に記録する。
        # 前回実行のコミットを取り込んでから(log を上書き生成)、コミット・push する。
        # push 失敗(競合など)は次回実行で再試行されるため警告のみで継続
        if: always()
        env:
          RUN_SUMMARY_JSON: /tmp/run-summary.json
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard FETCH_HEAD
          node scraper/run-log.mjs
          git add log/latest-run.md
          if git diff --cached --quiet; then
            echo "ログに変更がないためコミットをスキップします"
          else
            git commit -m "run log: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push || echo "::warning::push に失敗しました(次回実行で再試行されます)"
          fi