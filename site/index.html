<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 限定公開: 検索エンジンへの登録を拒否 -->
  <meta name="robots" content="noindex, nofollow">
  <title>掲示板ミラー - スレッド一覧</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="list">
  <header>
    <h1>掲示板ミラー</h1>
    <p><a href="/map">🗺 地図で見る</a></p>
    <p id="generated-at" class="generated-at"></p>
  </header>

  <main>
    <!-- ?area=神田,上野 などで絞り込んだときに表示 -->
    <p id="filter-info" class="filter-info" hidden></p>

    <table class="thread-table">
      <thead>
        <tr>
          <th class="col-title">タイトル</th>
          <th class="col-count">レス数</th>
          <th class="col-updated">最終更新</th>
        </tr>
      </thead>
      <tbody id="thread-rows">
        <tr>
          <td colspan="3" class="loading">読み込み中…</td>
        </tr>
      </tbody>
    </table>

    <!-- メインスレ(directThreads)。一覧とは別に固定リンクとして表示 -->
    <section id="main-threads" hidden>
      <h2>メインスレ</h2>
      <table class="thread-table main-thread-table">
        <tbody id="main-thread-rows"></tbody>
      </table>
    </section>

    <p id="error" class="error" hidden></p>
  </main>

  <footer>
    <p>このサイトはアクセス時に外部の掲示板から最新情報を取得して表示します(短時間キャッシュあり)。</p>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
